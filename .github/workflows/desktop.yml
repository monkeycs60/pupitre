name: Desktop Linux et macOS

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Installer et vérifier agent-browser natif
        run: bun run scripts/check-browser-install.ts
      - run: bun test scripts
      - run: bun test --timeout 15000
        working-directory: sidecar
      - run: bun test --isolate --timeout 15000
        working-directory: ui
      - name: Construire Linux
        if: runner.os == 'Linux'
        run: bunx --bun tauri build --bundles deb
      - name: Construire macOS
        if: runner.os == 'macOS'
        run: bunx --bun tauri build --bundles app
      - name: Vérifier le démarrage et l’arrêt natifs sur Mac
        if: runner.os == 'macOS'
        run: bun run scripts/smoke-desktop.ts src-tauri/target/release/bundle/macos/Pupitre.app/Contents/MacOS/app
      - name: Compiler et tester Rust
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Archiver le bundle Mac
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/Pupitre.app Pupitre-${{ runner.arch }}.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pupitre-${{ runner.os }}-${{ runner.arch }}
          path: |
            Pupitre-*.app.zip
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
