[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` ouvre le multiwebview : c'est ce qui permet de docker Claude Design
# dans la fenêtre principale au lieu d'ouvrir une fenêtre séparée. Tauri qualifie
# l'API d'inachevée, donc elle est confinée aux trois commandes `*_design_webview`
# de `lib.rs` — le reste de l'application n'en dépend pas.
tauri = { version = "2.11.3", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2"
