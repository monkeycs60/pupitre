[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` donne accès à `Window::add_child`, sans quoi il n'y a pas de
# multiwebview du tout. Il ne suffit pas : Tauri ne sait pas positionner une
# webview enfant sous Linux, et c'est `design_panel.rs` qui reprend la géométrie
# à la main. Lire l'en-tête de ce module avant d'y toucher.
tauri = { version = "2.11.3", features = ["unstable"] }
# Dépendances directes de `design_panel.rs`, qui réarrange la hiérarchie GTK que
# Tauri expose publiquement. Les lignes mineures doivent rester celles que Tauri
# résout déjà — `gtk 0.18.2` et `webkit2gtk 2.0.2` au lock — sinon les types ne
# s'unifient pas et rien ne compile. C'est le point à revérifier à chaque montée
# de version de Tauri.
gtk = "0.18"
webkit2gtk = "2.0"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2"
