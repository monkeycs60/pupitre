[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Pas de feature `unstable` : le multiwebview a été tenté pour docker Claude
# Design dans la fenêtre principale, et il ne peut pas fonctionner sous Linux.
# Tauri crée une webview enfant dans `window.default_vbox()`, une GtkBox, où wry
# la `pack_start` en marquant `is_in_fixed_parent = false` ; `set_bounds` ne
# repositionne alors rien (hors chemin X11), et la GtkBox partage l'espace
# verticalement entre les deux webviews. Voir `open_design_window`.
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2"
